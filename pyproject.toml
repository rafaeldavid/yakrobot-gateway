[project]
name = "yakrobot-gateway"
version = "0.1.0"
description = "Robot controller: per-robot MCP control + local fleet discovery + per-robot reservation. Transport-agnostic — MCP today, CLI/skills robots later. Auctions/marketplace live in yakrobot-marketplace."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastmcp>=2.14.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pyngrok>=7.5.0",
    "python-dotenv>=1.2.1",
    "typer>=0.12.0",
]

[project.optional-dependencies]
tumbller = ["httpx>=0.28.1"]
picar-freenove = ["httpx>=0.28.1"]
tello = ["djitellopy>=2.5.0"]
fakerobot = ["httpx>=0.28.1"]
# The simulator renders real JPEG frames for its /ws/video stream.
fakerobot-picar = ["httpx>=0.28.1", "pillow>=11.0", "numpy>=2.0"]
# Export a robot's metadata as a JSON RobotDescriptor (scripts/export_descriptor.py).
# On-chain registration itself happens in yakrobot-identity, fed that JSON — this
# gateway only produces the descriptor and holds no chain code.
export = ["yakrobot-descriptor[model]"]
# Recovers the signer of a paid-teleop capability against PAYMENTS_ISSUER — signature
# verification only: no RPC, no provider, no private key. See AGENTS.md.
payments = ["eth-keys>=0.7", "eth-hash[pycryptodome]>=0.7", "httpx>=0.28.1"]
# Per-operator Stripe fiat gate: raw httpx against the Stripe REST API (no SDK).
stripe = ["httpx>=0.28.1"]
all = [
    "httpx>=0.28.1", "djitellopy>=2.5.0", "pillow>=11.0", "numpy>=2.0",
    "eth-keys>=0.7", "eth-hash[pycryptodome]>=0.7",
]
# Tests use the fakerobot plugins (httpx, and pillow/numpy for the PiCar
# simulator's video stream), the descriptor exporter (Pydantic model), and the
# payments extra (capability fixtures/tests).
dev = [
    "pytest>=8.0",
    "httpx>=0.28.1",
    "pillow>=11.0",
    "numpy>=2.0",
    "yakrobot-descriptor[model]",
    "eth-keys>=0.7",
    "eth-hash[pycryptodome]>=0.7",
]

[project.scripts]
# Management CLI for the gateway (serve / robots / status / export / sim).
# `uv run yakrobot-py ...`, or `uv tool install --editable .` for a global `yakrobot-py`.
yakrobot-py = "yakrobot_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# App layout: only the CLI package is packaged. It puts src/ on sys.path at runtime so
# the flat core/ and plugins/ modules resolve from the editable checkout.
packages = ["src/yakrobot_cli"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
yakrobot-descriptor = { path = "../yakrobot-descriptor", editable = true }
